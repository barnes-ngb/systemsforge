<text x="332.0" y="128" font-size="13" text-anchor="middle" fill="currentColor" font-weight="400">compare</text>
<line x1="170" y1="88" x2="270" y2="116" stroke="currentColor" stroke-width="1" marker-end="url(#a)"/>
